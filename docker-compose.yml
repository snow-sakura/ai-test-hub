# AI-HUB 本地开发环境 Docker Compose
#
# 启动服务：            docker compose up -d
# 停止服务：            docker compose down
# 仅启动基础设施：      docker compose up -d mysql redis
#
# 数据库账号密码通过根目录 .env 注入（参考 .env.example），
# 已运行的数据卷不受修改影响（MySQL 仅在首次初始化时读取）。

version: "3.8"

services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: ai-hub-mysql
    restart: unless-stopped
    environment:
      # 开发密码通过根目录 .env 注入（参考 .env.example），默认值仅供本地演示
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_hub_test}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis 7 ==========
  redis:
    image: redis:7
    container_name: ai-hub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== AI-HUB 后端应用 ==========
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-hub-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
